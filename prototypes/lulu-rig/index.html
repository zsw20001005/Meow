<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>张噜噜 · 3D 角色原型</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body>
<header><a class="brand" href="./">噜噜<span>角色工作室</span></a><span class="edition">3D 骨骼原型 · 01</span></header>
<main><section class="stage" aria-label="可旋转的三维角色"><div id="viewport"></div><div class="stage-top"><span class="pill"><i></i><span id="status">自在站立</span></span><button id="reset-view" class="text-button">恢复视角 ↗</button></div><div class="stage-bottom"><span>拖动旋转 · 滚轮缩放</span><div class="views"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button></div></div><div id="loading">正在准备噜噜…</div></section>
<aside><div class="eyebrow">认识新的噜噜</div><h1>还是那个噜噜，<br>这次真的能走。</h1><p class="intro">眼镜、西瓜头，还有圆滚滚的身体。先看看立体形象，再看看每一步。</p>
<div class="actions"><button id="walk" class="primary">开始走路 <span>→</span></button><button id="pause" class="secondary">暂停</button></div>
<label class="slider-label" for="speed">步行速度 <output id="speed-value">1.0×</output></label><input id="speed" type="range" min="0.5" max="1.4" step="0.1" value="1"><div class="range-caption"><span>慢慢走</span><span>轻快一点</span></div>
<div class="divider"></div><div class="reference"><img src="./reference.png" alt="已选定的张噜噜参考形象"><div><strong>沿用已选定的形象</strong><p>这一版先确认比例与步态。<br>毛绒质感和细节仍可调整。</p></div></div>
<details><summary>查看动作结构</summary><label class="toggle"><input id="bones" type="checkbox"> 显示骨骼</label><label class="toggle"><input id="contacts" type="checkbox"> 显示脚掌落点</label><p class="detail-copy">脚掌落地时固定在地面，由髋、膝、踝关节跟随身体移动。</p><button id="check-contact" class="secondary full">检查脚掌接触</button><p id="contact-result" class="detail-copy" role="status"></p><button id="export" class="secondary full">下载骨骼模型 .glb</button></details>
<p class="footnote">独立原型预览，尚未替换桌面角色。</p></aside></main><script type="module" src="./main.mjs"></script></body></html>
