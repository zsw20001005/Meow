<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>张噜噜 · 动作预览</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#493e32;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0}header p{color:#827361}#stage{height:68vh;min-height:380px;position:relative;background:#ebe6dc;border-radius:24px;overflow:hidden}canvas{display:block;width:100%;height:100%}#loading{position:absolute;inset:45% 0;text-align:center;pointer-events:none}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button,select{font:inherit;border:1px solid #d9caba;border-radius:12px;background:#fffcf6;padding:11px 17px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#775735;border-color:#775735;color:white}button:disabled{opacity:.45;cursor:wait}button:focus-visible,select:focus-visible{outline:3px solid #c48029;outline-offset:3px}.views{position:absolute;right:16px;bottom:16px;display:flex;gap:7px}.views button{padding:8px 12px}#status{font-weight:600}footer{font-size:13px;color:#827361;margin-top:18px;line-height:1.8}a{color:#775735}@media(max-width:650px){main{padding:14px}header{align-items:flex-start;gap:12px}header p{font-size:12px}#stage{height:60vh}.bar{gap:7px}button{padding:10px 12px}}
</style></head><body><main><header><div><h1>张噜噜 · 动起来</h1><p>拖动看不同角度，滚轮调整大小</p></div><p id="status" role="status">正在加载噜噜…</p></header>
<section id="stage" aria-label="张噜噜三维动作预览"><div id="loading">正在加载模型和动作…</div><div class="views"><button data-view="front">正面</button><button data-view="quarter">斜侧面</button><button data-view="side">侧面</button></div></section>
<div class="bar" aria-label="动作"><button data-action="Idle" disabled>待机呼吸</button><button data-action="Blink" disabled>眨眨眼</button><button data-action="Nod" disabled>点点头</button><button data-action="Look" disabled>左右张望</button><button data-action="Wave" disabled>轻轻挥手</button></div>
<div class="bar"><button id="pause" disabled aria-pressed="false">暂停</button><label>速度 <select id="speed"><option value="0.6">慢速 0.6×</option><option value="1" selected>正常 1×</option><option value="1.4">快速 1.4×</option></select></label><span>动作结束后会自然回到待机</span></div>
<footer>本机 3D 动作预览 · 尚未替换桌面宠物。<br>模型原作：<a href="https://sketchfab.com/3d-models/a5747f74f0034470a2029a85f6e9c11d">Spencer0131「水豚噜噜」</a>，CC BY 4.0；本版修改了配色、眼睛、嘴鼻及动作绑定。</footer>
</main><script type="module" src="motion.mjs"></script></body></html>
